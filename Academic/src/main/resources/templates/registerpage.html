<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" href="/css/registerpagestyle.css">
<head>
  <title>Register</title>
</head>
<body>
<div class="auth-card">
  <h1>Register Form</h1>
  <form th:action="@{/register}" method="post" class="main-form">
    <label>
      <input type="text" name="name" placeholder="Enter name" />
    </label>
    <label>
      <input type="email" name="email" placeholder="Enter email" />
    </label>
    <label>
      <input type="password" name="password" placeholder="Enter password" />
    </label>
    <button type="submit">Register</button>
  </form>

  <form th:action="@{/login}" method="get" class="secondary-form">
    <button type="submit">Already have an account? Login</button>
  </form>
</div>
</body>
</html>
